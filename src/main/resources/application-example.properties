spring.application.name=hotel-management

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_management
spring.datasource.username=your_database_username
spring.datasource.password=your_database_password

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Security
jwt.secret-key=replace-with-a-long-random-secret-key-at-least-32-bytes

# Frontend
frontend.url=http://localhost:8082

# Stripe
stripe.secret-key=sk_test_replace_me
stripe.webhook.secret=whsec_replace_me
